<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharprender</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#02030a;--fg:#e8eefc;--mut:#7f8bad}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
h1{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5vh);left:0;right:0;margin:0;text-align:center;font-weight:200;font-size:clamp(1.7rem,4vw,3.1rem);letter-spacing:.42em;padding-left:.42em;background:linear-gradient(180deg,#fff 20%,#9fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(120,150,255,.35);animation:in 2.4s ease both;pointer-events:none}
@keyframes in{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
#comm{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:320px;height:min(560px,70vh);display:flex;flex-direction:column;border-radius:18px;background:rgba(9,13,28,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(140,170,255,.14);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(80,110,220,.05)}
#comm header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(140,170,255,.1);font-size:.8rem;letter-spacing:.12em}
#comm header small{margin-left:auto;color:var(--mut);font-size:.68rem;letter-spacing:.04em}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
#feed{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:14px 16px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24%);mask-image:linear-gradient(to bottom,transparent,#000 24%)}
.msg{font-size:.8rem;line-height:1.45;animation:m .5s ease both}
@keyframes m{from{opacity:0;transform:translateY(8px)}}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.68rem;color:var(--mut);margin-bottom:2px}
.meta b{font-weight:600}
.txt{color:#d5dcf2}
@media (max-width:820px){#comm{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto;height:30vh;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>Welcome</h1>
<aside id="comm" aria-label="Funkverkehr"><header><span class="dot"></span><b>FUNKVERKEHR</b><small>Subraum 47,3 MHz</small></header><div id="feed" aria-live="polite"></div></aside>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,D,R,cx,cy,nebula,mx=0,tmx=0;
const rnd=(a,b)=>a+Math.random()*(b-a),T=6.2832;
const stars=Array.from({length:520},()=>({x:Math.random(),y:Math.random(),r:rnd(.3,1.5),p:Math.random()*T,s:rnd(.5,2.5),l:Math.random()*3|0,c:['#fff','#cfe0ff','#ffe9c7','#d6c7ff'][Math.random()*4|0]}));
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;R=Math.min(W,H)*.16;cx=W/2;cy=H/2;buildNebula()}
function buildNebula(){nebula=document.createElement('canvas');const w=nebula.width=W>>1,h=nebula.height=H>>1,n=nebula.getContext('2d');n.globalCompositeOperation='lighter';
const cols=[[90,40,180],[30,110,190],[190,50,130],[40,150,150]];
for(const c of cols){const bx=rnd(.1,.9)*w,by=rnd(.1,.9)*h;for(let i=0;i<14;i++){const x=bx+rnd(-1,1)*w*.22,y=by+rnd(-1,1)*h*.22,r=rnd(.12,.3)*w,gr=n.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},.07)`);gr.addColorStop(1,'rgba(0,0,0,0)');n.fillStyle=gr;n.fillRect(x-r,y-r,2*r,2*r)}}}
/* ---------- Planet-Textur ---------- */
const TW=1024,TH=512,CW=512,CH=256;
const hs=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
const sm=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
function nz(x,y,p){const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0),a=((x0%p)+p)%p,b=(a+1)%p;return(hs(a,y0)*(1-fx)+hs(b,y0)*fx)*(1-fy)+(hs(a,y0+1)*(1-fx)+hs(b,y0+1)*fx)*fy}
function fbm(u,v,base,o){let s=0,a=.5,t=0;for(let i=0;i<o;i++){const p=base<<i;s+=a*nz(u*p,v*p*.5+i*7.3,p);t+=a;a*=.5}return s/t}
const tex=new Uint8ClampedArray(TW*TH*4),city=new Uint8Array(TW*TH),cloud=new Uint8Array(CW*CH);
for(let y=0;y<TH;y++){const v=y/TH;for(let x=0;x<TW;x++){const u=x/TW,e=fbm(u,v,4,6),m=fbm(u+.31,v+.17,3,4),i=y*TW+x,k=i*4,pol=Math.abs(v-.5)*2+(m-.5)*.18;let r,gg,b,land=0;
if(e<.5){const t=Math.max(0,(e-.3)/.2);r=mix(6,24,t);gg=mix(24,92,t);b=mix(70,150,t)}
else{land=255;const t=Math.min(1,(e-.5)/.2);
if(e<.525){r=196;gg=180;b=130}else if(m<.46){r=mix(170,120,t);gg=mix(135,100,t);b=mix(80,70,t)}else{r=mix(40,22,t);gg=mix(118,78,t);b=mix(52,38,t)}
if(e>.66){const q=Math.min(1,(e-.66)/.1);r=mix(r,115,q);gg=mix(gg,105,q);b=mix(b,100,q)}
if(e>.76)r=gg=b=240;
if(e>.525&&e<.64&&nz(u*160,v*80,160)>.62&&hs(x>>1,y>>1)>.8)city[i]=120+135*hs(x,y)}
if(pol>.86){const t=Math.min(1,(pol-.86)/.06);r=mix(r,238,t);gg=mix(gg,244,t);b=mix(b,252,t)}
tex[k]=r;tex[k+1]=gg;tex[k+2]=b;tex[k+3]=land}}
for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const c=fbm(x/CW,y/CH,5,5);cloud[y*CW+x]=255*sm(Math.min(1,Math.max(0,(c-.5)/.2)))}
/* ---------- Kugel vorberechnen ---------- */
const PS=360,C=PS/2,RP=C-2,pc=document.createElement('canvas');pc.width=pc.height=PS;
const px=pc.getContext('2d'),img=px.createImageData(PS,PS),dat=img.data,L=[-.62,-.28,.73],tilt=.41,ct=Math.cos(tilt),st=Math.sin(tilt);
const Hh=(()=>{const h=[L[0],L[1],L[2]+1],l=Math.hypot(...h);return h.map(q=>q/l)})();
const A={idx:[],lon:[],ty:[],day:[],spec:[],rim:[],al:[]};
for(let j=0;j<PS;j++)for(let i=0;i<PS;i++){const nx=(i+.5-C)/RP,ny=(j+.5-C)/RP,d2=nx*nx+ny*ny;if(d2>1.02)continue;const a=Math.min(1,(1-Math.sqrt(d2))*RP+.5);if(a<=0)continue;
const nv=Math.sqrt(Math.max(0,1-d2)),yy=ny*ct+nv*st,zz=-ny*st+nv*ct,df=nx*L[0]+ny*L[1]+nv*L[2];
A.idx.push((j*PS+i)*4);A.lon.push((Math.atan2(nx,zz)/T+.5)*TW);A.ty.push(Math.min(TH-1,Math.max(0,(.5+Math.asin(Math.max(-1,Math.min(1,yy)))/Math.PI)*TH|0)));
A.day.push(sm(Math.min(1,Math.max(0,(df+.1)/.5))));A.spec.push(Math.pow(Math.max(0,nx*Hh[0]+ny*Hh[1]+nv*Hh[2]),50));A.rim.push(Math.pow(1-nv,2.6));A.al.push(a*255)}
const N=A.idx.length;
function drawPlanet(rp){const cp=rp*1.35;for(let k=0;k<N;k++){const t=A.ty[k],ti=t*TW+(((A.lon[k]+rp)|0)&1023),b=ti*4,d=A.day[k],lit=.045+d*1.05;let r=tex[b]*lit,gg=tex[b+1]*lit,bl=tex[b+2]*lit;
if(!tex[b+3]){const s=A.spec[k]*d*150;r+=s;gg+=s;bl+=s}
const cl=city[ti];if(cl&&d<.5){const n=(1-d*2)*cl/255;r+=255*n;gg+=190*n;bl+=90*n}
const c=cloud[(t>>1)*CW+((((A.lon[k]+cp)|0)>>1)&511)]/255*.88,w=240*(.06+d*.95);r=r*(1-c)+w*c;gg=gg*(1-c)+w*c;bl=bl*(1-c)+(w+8)*c;
const rm=A.rim[k]*(.15+d),o=A.idx[k];dat[o]=r+50*rm;dat[o+1]=gg+120*rm;dat[o+2]=bl+255*rm;dat[o+3]=A.al[k]}
px.putImageData(img,0,0)}
/* ---------- Objekte ---------- */
const O=[
{id:'SHARPRENDER',kind:'ship',rx:2.35,ry:.62,tl:-.28,s:.22,p:0,col:'#fbbf24'},
{id:'AURORA-1',kind:'sat',rx:1.5,ry:.45,tl:.5,s:-.5,p:1.2,col:'#a78bfa'},
{id:'HELIOS-7',kind:'sat',rx:1.75,ry:1.1,tl:-.9,s:.38,p:3,col:'#34d399'},
{id:'VEGA-RELAIS',kind:'sat',rx:1.35,ry:.3,tl:1.2,s:.7,p:4.5,col:'#f472b6'},
{id:'LUNA-STATION',kind:'moon',rx:2.0,ry:.75,tl:.45,s:.09,p:2,col:'#cbd5e1'}];
const TERRA={id:'TERRA-KONTROLLE',col:'#5fd0ff'},byId={'TERRA-KONTROLLE':TERRA};O.forEach(o=>byId[o.id]=o);
function pos(o,t){const a=o.p+t*o.s,ex=Math.cos(a)*o.rx*R,ey=Math.sin(a)*o.ry*R,c=Math.cos(o.tl),s=Math.sin(o.tl);return{x:cx+ex*c-ey*s,y:cy+ex*s+ey*c,z:Math.sin(a)}}
function ship(t){
let gr=g.createLinearGradient(-78,0,-200,0);gr.addColorStop(0,'rgba(120,190,255,.55)');gr.addColorStop(1,'rgba(120,190,255,0)');g.fillStyle=gr;g.fillRect(-200,-2,122,4);
g.strokeStyle='#7d889e';g.lineWidth=2.2;g.beginPath();g.moveTo(-42,0);g.lineTo(-52,-16);g.moveTo(-42,0);g.lineTo(-52,16);g.stroke();
for(const y of[-17,17]){const n=g.createLinearGradient(0,y-6,0,y+6);n.addColorStop(0,'#aab3c5');n.addColorStop(1,'#4b5568');g.fillStyle=n;g.beginPath();g.roundRect(-78,y-5,50,10,5);g.fill();
g.fillStyle=`rgba(90,170,255,${.6+.4*Math.sin(t*6+y)})`;g.fillRect(-72,y-2.5,34,5);g.fillStyle='#ff5a3c';g.beginPath();g.arc(-29,y,4.5,0,T);g.fill()}
g.fillStyle='#8b95aa';g.beginPath();g.ellipse(-36,0,24,7.5,0,0,T);g.fill();
g.fillStyle='#5ad0ff';g.beginPath();g.arc(-20,0,3.2,0,T);g.fill();
g.fillStyle='#7a849a';g.fillRect(-18,-3,28,6);
gr=g.createRadialGradient(26,-6,2,28,0,38);gr.addColorStop(0,'#f3f6fc');gr.addColorStop(1,'#7c879d');g.fillStyle=gr;g.beginPath();g.ellipse(28,0,30,21,0,0,T);g.fill();
g.strokeStyle='rgba(30,40,60,.5)';g.lineWidth=.8;g.beginPath();g.ellipse(28,0,22,14,0,0,T);g.stroke();
g.fillStyle='#cfd6e6';g.beginPath();g.arc(32,0,6,0,T);g.fill();g.fillStyle='rgba(80,90,110,.8)';g.beginPath();g.arc(32,0,2.2,0,T);g.fill();
g.fillStyle='rgba(255,230,160,.85)';for(let i=0;i<9;i++){const a=i*.7;g.fillRect(28+Math.cos(a)*18-.6,Math.sin(a)*11-.6,1.2,1.2)}
g.fillStyle=Math.sin(t*5)>0?'#ff4d4d':'#5a1c1c';g.fillRect(55,-1,2,2)}
function sat(t,col){g.fillStyle='#d8b45a';g.fillRect(-4,-3,8,6);
for(const s of[-1,1]){const x=s>0?5:-19;g.fillStyle='#244f9e';g.fillRect(x,-3.2,14,6.4);g.strokeStyle='rgba(160,200,255,.6)';g.lineWidth=.5;g.beginPath();for(let i=1;i<4;i++){g.moveTo(x+i*3.5,-3.2);g.lineTo(x+i*3.5,3.2)}g.moveTo(x,0);g.lineTo(x+14,0);g.stroke()}
g.fillStyle='#e5e7eb';g.beginPath();g.arc(0,-5,2.2,Math.PI,0);g.fill();
g.fillStyle=Math.sin(t*4+col.length)>.3?col:'#222';g.fillRect(-1,-1,2,2)}
function moon(r){const gr=g.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r*1.05);gr.addColorStop(0,'#eceef3');gr.addColorStop(.6,'#9aa1b0');gr.addColorStop(1,'#2c313d');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,T);g.fill();
g.fillStyle='rgba(60,66,80,.35)';for(const[a,b,s]of[[.3,.1,.22],[-.25,.35,.16],[.1,-.4,.14],[-.45,-.1,.1]]){g.beginPath();g.arc(a*r,b*r,s*r,0,T);g.fill()}}
function ring(o,front){g.save();g.translate(cx,cy);g.rotate(o.tl);g.beginPath();g.ellipse(0,0,o.rx*R,o.ry*R,0,front?0:Math.PI,front?Math.PI:T);g.stroke();g.restore()}
let cur=null,sh=null,nextSh=3;
function drawObj(e,t){const{o,P}=e;g.save();g.translate(P.x,P.y);const k=R/200*(.85+.25*P.z);
if(o.kind==='ship'){const q=pos(o,t+.03),h=Math.atan2(q.y-P.y,q.x-P.x);g.rotate(h);if(Math.cos(h)<0)g.scale(1,-1);g.scale(k,k);ship(t)}
else if(o.kind==='sat'){g.rotate(t*.4+o.p);g.scale(k*.8,k*.8);sat(t,o.col)}
else moon(R*.17*(.9+.15*P.z));
g.restore();
if(!(P.z<0&&Math.hypot(P.x-cx,P.y-cy)<R)){g.fillStyle='rgba(200,215,255,.5)';g.font='10px ui-monospace,Menlo,monospace';g.fillText(o.id,P.x+16,P.y-12)}}
let last=0,rot=0;
function frame(ms){const t=ms/1000,dt=Math.min(.05,t-last);last=t;rot+=dt*30;mx+=(tmx-mx)*.04;
g.setTransform(D,0,0,D,0,0);g.globalAlpha=1;g.fillStyle='#02030a';g.fillRect(0,0,W,H);
g.globalAlpha=.9;g.drawImage(nebula,-20-mx*14,-20+Math.sin(t*.05)*8,W+40,H+40);g.globalAlpha=1;
for(const s of stars){const x=(s.x*W+t*(s.l+1)*1.2+mx*(s.l+1)*8)%W,y=s.y*H;g.globalAlpha=(.6+.4*Math.sin(t*s.s+s.p))*(.45+.2*s.l);g.fillStyle=s.c;if(s.r>1.1){g.beginPath();g.arc(x,y,s.r,0,T);g.fill()}else g.fillRect(x,y,s.r*1.4,s.r*1.4)}
g.globalAlpha=1;
if(!sh&&t>nextSh){sh={x:rnd(0,W),y:rnd(0,H*.4),a:rnd(.4,.9),age:0};nextSh=t+rnd(6,12)}
if(sh){sh.age+=dt;const l=sh.age*900,hx=sh.x+Math.cos(sh.a)*l,hy=sh.y+Math.sin(sh.a)*l,gr=g.createLinearGradient(hx-Math.cos(sh.a)*120,hy-Math.sin(sh.a)*120,hx,hy);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,255,255,.9)');g.strokeStyle=gr;g.lineWidth=1.4;g.beginPath();g.moveTo(hx-Math.cos(sh.a)*120,hy-Math.sin(sh.a)*120);g.lineTo(hx,hy);g.stroke();if(sh.age>.7)sh=null}
const objs=O.map(o=>({o,P:pos(o,t)})).sort((a,b)=>a.P.z-b.P.z);
g.setLineDash([2,6]);g.lineWidth=1;g.strokeStyle='rgba(150,180,255,.1)';O.forEach(o=>ring(o,false));
objs.filter(e=>e.P.z<0).forEach(e=>drawObj(e,t));
let gr=g.createRadialGradient(cx,cy,R*.95,cx,cy,R*1.38);gr.addColorStop(0,'rgba(90,160,255,.38)');gr.addColorStop(1,'rgba(90,160,255,0)');g.fillStyle=gr;g.fillRect(cx-R*1.4,cy-R*1.4,R*2.8,R*2.8);
drawPlanet(rot);const sz=R*PS/RP;g.drawImage(pc,cx-sz/2,cy-sz/2,sz,sz);
g.setLineDash([2,6]);g.strokeStyle='rgba(150,180,255,.1)';O.forEach(o=>ring(o,true));g.setLineDash([]);
objs.filter(e=>e.P.z>=0).forEach(e=>drawObj(e,t));
if(cur){const age=t-cur.t0;if(age<2.4){const pf=byId[cur.f],pt=byId[cur.to],P=id=>id===TERRA?{x:cx,y:cy}:pos(id,t),a=P(pf);
const fade=Math.max(0,1-age/2.4);
if(pt){const b=P(pt);g.setLineDash([4,6]);g.lineDashOffset=-age*30;g.strokeStyle=pf.col;g.globalAlpha=.55*fade;g.lineWidth=1.2;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.setLineDash([]);g.lineDashOffset=0}
for(let i=0;i<2;i++){const q=age-i*.5;if(q>0){g.globalAlpha=Math.max(0,1-q/1.5)*.7;g.strokeStyle=pf.col;g.lineWidth=1.5;g.beginPath();g.arc(a.x,a.y,(pf===TERRA?R*1.05:8)+q*(pf===TERRA?R*.4:40),0,T);g.stroke()}}
g.globalAlpha=1}}
requestAnimationFrame(frame)}
addEventListener('resize',resize);addEventListener('pointermove',e=>tmx=e.clientX/W-.5);
resize();requestAnimationFrame(frame);
/* ---------- Funkverkehr ---------- */
const feed=document.getElementById('feed'),TK='TERRA-KONTROLLE',SH='SHARPRENDER';
const script=[
[TK,SH,'Willkommen im Orbit, Sharprender. Bitte Kurs und Geschwindigkeit bestätigen.'],
[SH,TK,'Kurs bestätigt. Impulsantrieb auf 0,25, Schilde im Standby.'],
['AURORA-1',TK,'Telemetrie stabil. Solarpaneele zu 98 % ausgerichtet.'],
[TK,'AURORA-1','Verstanden, Aurora. Datenübertragung läuft.'],
['HELIOS-7',SH,'Achtung: Mikrometeoritenschauer in Sektor 7. Empfehle Kursanpassung um 3 Grad.'],
[SH,'HELIOS-7','Danke, Helios. Navigation korrigiert. Schilde hoch.'],
['LUNA-STATION',TK,'Mondbasis meldet: Energieversorgung nominal, keine Anomalien.'],
['VEGA-RELAIS',TK,'Signalstärke 99,7 %. Subraum-Kanal frei.'],
[TK,SH,'Sternzeit 2610.24: Andockfreigabe für Dock 3 erteilt.'],
[SH,'LUNA-STATION','Hier Sharprender. Nähern uns Ihrer Position, bitte um Traktorstrahl-Freigabe.'],
['LUNA-STATION',SH,'Freigabe erteilt. Traktorstrahl bereit.'],
['AURORA-1','VEGA-RELAIS','Relais-Test: bitte Ping bestätigen.'],
['VEGA-RELAIS','AURORA-1','Ping empfangen. Latenz 12 ms.'],
['HELIOS-7',TK,'Nachtseite zeigt Stadtlichter über dem Kontinent. Ein schöner Anblick.'],
[TK,'ALLE','An alle Einheiten: Wetterfenster stabil, Orbit frei.'],
[SH,TK,'Warpkern stabil. Wir halten den Orbit, bis neue Befehle eintreffen.']];
let si=0;
function type(el,s){let i=0;(function n(){el.textContent=s.slice(0,++i);if(i<s.length)setTimeout(n,20)})()}
function say(){const[f,to,txt]=script[si++%script.length],m=document.createElement('div');m.className='msg';
const meta=document.createElement('div');meta.className='meta';
const t=document.createElement('span');t.textContent=new Date().toLocaleTimeString('de-DE');
const a=document.createElement('b');a.textContent=f;a.style.color=byId[f].col;
const ar=document.createElement('span');ar.textContent='→';
const b=document.createElement('b');b.textContent=to;b.style.color=byId[to]?byId[to].col:'#cbd5e1';
meta.append(t,a,ar,b);const x=document.createElement('div');x.className='txt';m.append(meta,x);feed.append(m);
while(feed.children.length>12)feed.firstChild.remove();
type(x,txt);cur={f,to,t0:performance.now()/1000};
setTimeout(say,txt.length*22+rnd(1400,2600))}
setTimeout(say,1500);
})();
</script>
</body>
</html>
