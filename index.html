<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharprender - Welcome</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D simulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Outfit for clean, modern, elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        /* Subtle glow animation for the Welcome text */
        @keyframes subtleGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(56, 189, 248, 0.4), 0 0 40px rgba(56, 189, 248, 0.2); }
            50% { text-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 0 60px rgba(56, 189, 248, 0.4); }
        }
        .welcome-glow {
            animation: subtleGlow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between select-none">

    <!-- 3D Canvas Background Container -->
    <div id="webgl-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-overlay w-full h-full flex flex-col justify-between p-6 sm:p-10">
        
        <!-- Top Center: Welcome Header -->
        <header class="w-full flex justify-center pt-4 sm:pt-8">
            <h1 class="text-4xl sm:text-6xl lg:text-7xl font-light tracking-[0.2em] text-white uppercase welcome-glow">
                Welcome
            </h1>
        </header>

        <!-- Center Spacer (Leaves room for the 3D planet and rocket) -->
        <main class="flex-grow flex items-center justify-center">
            <!-- Optional subtle center caption or interaction hint can go here if needed -->
        </main>

        <!-- Bottom Footer / Brand Identification -->
        <footer class="w-full flex flex-col sm:flex-row items-center justify-between text-xs sm:text-sm text-slate-400 font-light tracking-wider gap-4 pb-2">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span class="text-slate-300 font-medium">Sharprender Systems</span>
            </div>
            <div>
                <p class="text-slate-500">Immersive Orbital Simulation v2.4</p>
            </div>
        </footer>
    </div>

    <!-- JavaScript for Three.js Simulation -->
    <script>
        // Global variables for Three.js scene
        let scene, camera, renderer;
        let earth, clouds, atmosphere, starField;
        let rocketGroup;
        let starsGeometry;
        
        // Mouse interaction variables
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        // Orbit parameters for the rocket
        let orbitAngle = 0;
        const orbitRadiusX = 4.2;
        const orbitRadiusZ = 3.2;

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.015);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 6.5);
            camera.lookAt(0, 0, 0);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
            sunLight.position.set(10, 6, 8);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Additional rim light for cinematic deep-space look
            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.0);
            rimLight.position.set(-10, -5, -8);
            scene.add(rimLight);

            // 5. Create Starfield Background
            createStarfield();

            // 6. Create Planet Earth
            createEarth();

            // 7. Create Orbiting Rocket
            createRocket();

            // 8. Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onDocumentMouseMove);
            document.addEventListener('touchmove', onTouchMove, { passive: true });

            // Start animation loop
            animate();
        }

        // Generate procedural starfield with twinkle effect
        function createStarfield() {
            const starsCount = 1200;
            starsGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starsCount * 3);
            const colors = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 200;
                positions[i + 1] = (Math.random() - 0.5) * 200;
                positions[i + 2] = (Math.random() - 0.5) * 200;

                // Subtle variations in star color (white, blueish, warm white)
                const colorChoice = Math.random();
                if (colorChoice > 0.8) {
                    colors[i] = 0.6; colors[i+1] = 0.8; colors[i+2] = 1.0; // Blue tint
                } else if (colorChoice > 0.6) {
                    colors[i] = 1.0; colors[i+1] = 0.9; colors[i+2] = 0.7; // Warm tint
                } else {
                    colors[i] = 1.0; colors[i+1] = 1.0; colors[i+2] = 1.0; // Pure white
                }
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starsMaterial = new THREE.PointsMaterial({
                size: 0.7,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        // Generate procedural Earth texture dynamically using HTML5 Canvas
        function generateEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Deep ocean blue background
            ctx.fillStyle = '#0f1f38';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stylized continents (procedural generative landmasses)
            ctx.fillStyle = '#1e3a2f';
            ctx.strokeStyle = '#2d5a45';
            ctx.lineWidth = 15;

            // Helper to draw continent blobs
            function drawBlob(x, y, radius, points) {
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = radius * (0.8 + Math.sin(i * 3) * 0.2 + Math.cos(i * 5) * 0.1);
                    const px = x + Math.cos(angle) * r;
                    const py = y + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Generate continent land masses across the texture map
            drawBlob(512, 300, 220, 12); // North America / Europe
            drawBlob(650, 650, 180, 10); // South America / Africa
            drawBlob(1300, 350, 280, 15); // Asia
            drawBlob(1500, 750, 150, 10); // Australia / Indonesia
            drawBlob(1024, 900, 300, 14); // Antarctica

            // Add some polar ice caps
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, 60);
            ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

            return new THREE.CanvasTexture(canvas);
        }

        // Generate procedural cloud texture
        function generateCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw soft cloud swirls
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = 80 + Math.random() * 180;
                
                const gradient = ctx.createRadialGradient(x, y, 10, x, y, r);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Create Earth, Atmosphere, and Clouds
        function createEarth() {
            const earthRadius = 1.8;
            const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);

            const earthMaterial = new THREE.MeshStandardMaterial({
                map: generateEarthTexture(),
                roughness: 0.8,
                metalness: 0.2,
                bumpScale: 0.05
            });

            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            earth.castShadow = true;
            earth.receiveShadow = true;
            scene.add(earth);

            // Clouds layer
            const cloudsGeometry = new THREE.SphereGeometry(earthRadius + 0.03, 64, 64);
            const cloudsMaterial = new THREE.MeshStandardMaterial({
                map: generateCloudTexture(),
                transparent: true,
                blending: THREE.NormalBlending,
                opacity: 0.8,
                depthWrite: false
            });
            clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
            scene.add(clouds);

            // Atmosphere glow mesh
            const atmosGeometry = new THREE.SphereGeometry(earthRadius + 0.12, 64, 64);
            const atmosMaterial = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            atmosphere = new THREE.Mesh(atmosGeometry, atmosMaterial);
            scene.add(atmosphere);
        }

        // Create a detailed 3D Rocket
        function createRocket() {
            rocketGroup = new THREE.Group();

            // Rocket Body (Cylinder)
            const bodyGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3, metalness: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            rocketGroup.add(body);

            // Rocket Nose Cone
            const coneGeo = new THREE.ConeGeometry(0.08, 0.3, 16);
            const coneMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, metalness: 0.4 }); // Red tip
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.y = 0.55;
            rocketGroup.add(cone);

            // Rocket Fins (3 fins)
            const finGeo = new THREE.BoxGeometry(0.02, 0.25, 0.15);
            const finMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 }); // Blue fins
            for (let i = 0; i < 3; i++) {
                const fin = new THREE.Mesh(finGeo, finMat);
                const angle = (i / 3) * Math.PI * 2;
                fin.position.x = Math.cos(angle) * 0.08;
                fin.position.z = Math.sin(angle) * 0.08;
                fin.position.y = -0.3;
                fin.rotation.y = -angle;
                fin.rotation.z = (i % 2 === 0 ? 0.2 : -0.2);
                rocketGroup.add(fin);
            }

            // Thruster Flame
            const flameGeo = new THREE.ConeGeometry(0.06, 0.3, 12);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.9 });
            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.position.y = -0.55;
            flame.rotation.x = Math.PI; // Point downwards
            rocketGroup.add(flame);

            // Scale down and add to scene
            rocketGroup.scale.set(1.2, 1.2, 1.2);
            scene.add(rocketGroup);
        }

        // Handle window resizing
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Mouse move parallax
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        }

        // Touch move parallax for mobile
        function onTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX) * 0.001;
                mouseY = (event.touches[0].clientY - windowHalfY) * 0.001;
            }
        }

        // Main Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Smooth damping for camera parallax based on mouse
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            camera.position.x = targetX * 2;
            camera.position.y = 1.5 + (-targetY * 2);
            camera.lookAt(0, 0, 0);

            // Rotate Earth and Clouds on their axis
            if (earth) earth.rotation.y += 0.001;
            if (clouds) clouds.rotation.y += 0.0013; // Clouds rotate slightly faster

            // Rotate starfield very slowly for ambient motion
            if (starField) starField.rotation.y += 0.0001;

            // Orbit Rocket around the Earth
            if (rocketGroup) {
                orbitAngle += 0.008; // Orbit speed

                // Calculate elliptical path coordinates
                const x = Math.cos(orbitAngle) * orbitRadiusX;
                const z = Math.sin(orbitAngle) * orbitRadiusZ;
                const y = Math.sin(orbitAngle * 2) * 0.4; // Slight inclination/wave on Y axis

                rocketGroup.position.set(x, y, z);

                // Make the rocket look ahead along the tangent of its orbit
                const nextX = Math.cos(orbitAngle + 0.01) * orbitRadiusX;
                const nextZ = Math.sin(orbitAngle + 0.01) * orbitRadiusZ;
                const nextY = Math.sin((orbitAngle + 0.01) * 2) * 0.4;

                rocketGroup.lookAt(nextX, nextY, nextZ);
                // Adjust rotation so the nose points forward along path
                rocketGroup.rotateX(Math.PI / 2);
            }

            renderer.render(scene, camera);
        }

        // Initialize on window load
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
