<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sharprender - Realistic Slow Orbit</title>
    <style>
        :root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#010206;--fg:#e8eefc;--mut:#7f8bad}
        html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        #c{position:fixed;inset:0;width:100%;height:100%;display:block}
        h1{position:fixed;top:calc(env(safe-area-inset-top,0px) + 5vh);left:0;right:0;margin:0;text-align:center;font-weight:200;font-size:clamp(1.7rem,4vw,3.1rem);letter-spacing:.42em;padding-left:.42em;background:linear-gradient(180deg,#fff 20%,#9fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(120,150,255,.35);animation:in 2.4s ease both;pointer-events:none}
        @keyframes in{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
        #comm{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:320px;height:min(560px,70vh);display:flex;flex-direction:column;border-radius:18px;background:rgba(7,10,22,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(140,170,255,.14);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(80,110,220,.05)}
        #comm header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(140,170,255,.1);font-size:.8rem;letter-spacing:.12em}
        #comm header small{margin-left:auto;color:var(--mut);font-size:.68rem;letter-spacing:.04em}
        .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:p 1.6s infinite}
        @keyframes p{50%{opacity:.25}}
        #feed{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:14px 16px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24%);mask-image:linear-gradient(to bottom,transparent,#000 24%)}
        .msg{font-size:.8rem;line-height:1.45;animation:m .5s ease both}
        @keyframes m{from{opacity:0;transform:translateY(8px)}}
        .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.68rem;color:var(--mut);margin-bottom:2px}
        .meta b{font-weight:600}
        .txt{color:#d5dcf2}
        @media (max-width:820px){#comm{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto;height:30vh;transform:none}}
    </style>
</head>
<body>
<canvas id="c"></canvas>
<h1>Welcome</h1>
<aside id="comm" aria-label="Funkverkehr"><header><span class="dot"></span><b>FUNKVERKEHR</b><small>Subraum 47,3 MHz</small></header><div id="feed" aria-live="polite"></div></aside>
<script>
    (()=>{
        const cv=document.getElementById('c'),g=cv.getContext('2d');
        let W,H,D,R,cx,cy,nebula,mx=0,tmx=0;
        const rnd=(a,b)=>a+Math.random()*(b-a),T=6.2832;

        const STAR_COLORS = ['#9bb0ff', '#aabfff', '#cad8ff', '#f8f7ff', '#fff4ea', '#ffd2a1', '#ffcc6f', '#ffaa6e'];
        const stars=Array.from({length:850},()=>({
            x:Math.random(),
            y:Math.random(),
            r:Math.pow(Math.random(), 3) * 1.6 + 0.3,
            p:Math.random()*T,
            s:rnd(.2,1.8),
            l:Math.random()*3|0,
            c:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)]
        }));

        function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;R=Math.min(W,H)*.16;cx=W/2;cy=H/2;buildNebula()}

        function buildNebula(){
            nebula=document.createElement('canvas');
            const w=nebula.width=W>>1,h=nebula.height=H>>1,n=nebula.getContext('2d');
            n.globalCompositeOperation='lighter';
            const cols=[[40,20,80],[20,50,90],[80,30,60],[15,60,70]];
            for(const c of cols){
                const bx=rnd(.1,.9)*w,by=rnd(.1,.9)*h;
                for(let i=0;i<18;i++){
                    const x=bx+rnd(-1,1)*w*.28,y=by+rnd(-1,1)*h*.28,r=rnd(.15,.38)*w,gr=n.createRadialGradient(x,y,0,x,y,r);
                    gr.addColorStop(0,`rgba(${c},.04)`);
                    gr.addColorStop(1,'rgba(0,0,0,0)');
                    n.fillStyle=gr;n.fillRect(x-r,y-r,2*r,2*r);
                }
            }
            buildDeep();
        }

        let deep;
        function buildDeep(){
            deep=document.createElement('canvas');deep.width=W;deep.height=H;
            const d=deep.getContext('2d');
            d.save();d.translate(W/2,H/2);d.rotate(-.45);
            const bh=H*.35,gr=d.createLinearGradient(0,-bh,0,bh);
            gr.addColorStop(0,'rgba(120,140,200,0)');
            gr.addColorStop(.3,'rgba(140,150,220,.05)');
            gr.addColorStop(.5,'rgba(170,180,245,.11)');
            gr.addColorStop(.7,'rgba(140,150,220,.05)');
            gr.addColorStop(1,'rgba(120,140,200,0)');
            d.fillStyle=gr;d.fillRect(-W*1.5,-bh,3*W,2*bh);

            for(let i=0;i<3500;i++){
                const band=i%4>0,x=rnd(-W*1.2,W*1.2),y=band?(Math.random()+Math.random()+Math.random()-1.5)*bh*.8:rnd(-H,H);
                d.fillStyle=`rgba(${190+Math.random()*60|0},${205+Math.random()*50|0},255,${rnd(.05,.45)})`;
                d.fillRect(x,y,rnd(.5,1.2),rnd(.5,1.2));
            }
            d.globalCompositeOperation='destination-out';
            for(let i=0;i<12;i++){
                const x=rnd(-W*.8,W*.8),y=rnd(-bh*.6,bh*.6),r=rnd(30,110);
                const dg=d.createRadialGradient(x,y,0,x,y,r);
                dg.addColorStop(0,'rgba(0,0,0,0.6)');
                dg.addColorStop(1,'rgba(0,0,0,0)');
                d.fillStyle=dg;d.beginPath();d.arc(x,y,r,0,T);d.fill();
            }
            d.restore();
        }

        const TW=2048,TH=1024,CW=2048,CH=1024;
        const hs=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
        const sm=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
        function nz(x,y,p){const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0),a=((x0%p)+p)%p,b=(a+1)%p;return(hs(a,y0)*(1-fx)+hs(b,y0)*fx)*(1-fy)+(hs(a,y0+1)*(1-fx)+hs(b,y0+1)*fx)*fy}
        function fbm(u,v,base,o){let s=0,a=.5,t=0;for(let i=0;i<o;i++){const p=base<<i;s+=a*nz(u*p,v*p*.5+i*7.3,p);t+=a;a*=.5}return s/t}
        const tex=new Uint8ClampedArray(TW*TH*4),city=new Uint8Array(TW*TH),hgt=new Uint8Array(TW*TH),cloud=new Uint8Array(CW*CH);
        function texel(x,y){const v=y/TH,u=x/TW,e=fbm(u,v,4,8),m=fbm(u+.31,v+.17,3,4),i=y*TW+x,k=i*4,pol=Math.abs(v-.5)*2+(m-.5)*.18;let r,gg,b,land=0,dt=.5;city[i]=0;
            if(e<.5){const t=Math.max(0,(e-.3)/.2);r=mix(5,30,t*t);gg=mix(22,135,t*t);b=mix(66,165,t*t);if(e>.486){const f=(e-.486)/.014*.6;r=mix(r,200,f);gg=mix(gg,232,f);b=mix(b,236,f)}}
            else{land=255;const t=Math.min(1,(e-.5)/.2);
                const lat=Math.abs(v-.5)*2;if(e<.525){r=196;gg=180;b=130}else{const sc=x=>x<0?0:x>1?1:x,dr=1-sm(sc((m-.43)/.06)),wr=sm(sc((m-.55)/.08))*(1-sm(sc((lat-.25)/.12))),wt=sm(sc((lat-.5)/.18)),wd=dr*(1-wt);
                    let R1=mix(58,26,t),G1=mix(128,84,t),B1=mix(54,38,t);
                    R1=mix(R1,mix(18,14,t),wr);G1=mix(G1,mix(88,62,t),wr);B1=mix(B1,mix(34,28,t),wr);
                    R1=mix(R1,mix(92,70,t),wt);G1=mix(G1,mix(104,82,t),wt);B1=mix(B1,mix(76,62,t),wt);
                    R1=mix(R1,mix(205,150,t),wd);G1=mix(G1,mix(160,115,t),wd);B1=mix(B1,mix(92,72,t),wd);r=R1;gg=G1;b=B1}
                if(e>.64){const q=sm(Math.min(1,(e-.64)/.12));r=mix(r,128,q);gg=mix(gg,118,q);b=mix(b,110,q)}
                if(e>.72){const q=sm(Math.min(1,(e-.72)/.1));r=mix(r,244,q);gg=mix(gg,246,q);b=mix(b,250,q)}
                if(e>.525&&e<.64&&nz(u*160,v*80,160)>.62&&hs(x>>2,y>>2)>.72)city[i]=120+135*hs(x,y)}
            if(pol>.86){const t=Math.min(1,(pol-.86)/.06);r=mix(r,238,t);gg=mix(gg,244,t);b=mix(b,252,t)}
            if(land){dt=fbm(u,v,48,4);const q=.78+.44*dt;r*=q;gg*=q;b*=q}const gn=.9+.2*nz(u*512,v*256,512);tex[k]=r*gn;tex[k+1]=gg*gn;tex[k+2]=b*gn;tex[k+3]=land;hgt[i]=Math.max(0,Math.min(255,e*255+(dt-.5)*70))}
        function cloudTexel(x,y){const c=fbm(x/CW,y/CH,6,7);cloud[y*CW+x]=255*Math.pow(sm(Math.min(1,Math.max(0,(c-.44)/.36))),1.15)}
        let ready=false,cloudsReady=false,ca=0,stage=0,gy=0,fade=0;
        function cp(i,j){for(let q=0;q<4;q++)tex[j*4+q]=tex[i*4+q];city[j]=city[i];hgt[j]=hgt[i]}
        function gen(ms){const t0=performance.now();while(stage<3&&performance.now()-t0<ms){
            if(stage===0){for(let x=0;x<TW;x+=2){texel(x,gy);const i=gy*TW+x;cp(i,i+1);cp(i,i+TW);cp(i,i+TW+1)}gy+=2;if(gy>=TH){stage=1;gy=0;ready=true}}
            else if(stage===1){for(let x=0;x<CW;x++)cloudTexel(x,gy);if(++gy>=CH){stage=2;gy=0;cloudsReady=true}}
            else{for(let x=0;x<TW;x++)if((x|gy)&1)texel(x,gy);if(++gy>=TH)stage=3}}}

        const PS=512,C=PS/2,RP=C-2,pc=document.createElement('canvas');pc.width=pc.height=PS;
        const px=pc.getContext('2d'),img=px.createImageData(PS,PS),dat=img.data,L=[-.62,-.28,.73],tilt=.41,ct=Math.cos(tilt),st=Math.sin(tilt);
        const Hh=(()=>{const h=[L[0],L[1],L[2]+1],l=Math.hypot(...h);return h.map(q=>q/l)})();
        const A={idx:[],lon:[],ty:[],tf:[],day:[],spec:[],rim:[],al:[]};
        for(let j=0;j<PS;j++)for(let i=0;i<PS;i++){const nx=(i+.5-C)/RP,ny=(j+.5-C)/RP,d2=nx*nx+ny*ny;if(d2>1.02)continue;const a=Math.min(1,(1-Math.sqrt(d2))*RP+.5);if(a<=0)continue;
            const nv=Math.sqrt(Math.max(0,1-d2)),yy=ny*ct+nv*st,zz=-ny*st+nv*ct,df=nx*L[0]+ny*L[1]+nv*L[2];
            A.idx.push((j*PS+i)*4);A.lon.push((Math.atan2(nx,zz)/T+.5)*TW);A.ty.push(Math.min(TH-1,Math.max(0,(.5+Math.asin(Math.max(-1,Math.min(1,yy)))/Math.PI)*TH|0)));A.tf.push(Math.min(CH-1.01,Math.max(0,(.5+Math.asin(Math.max(-1,Math.min(1,yy)))/Math.PI)*CH)));
            A.day.push(sm(Math.min(1,Math.max(0,(df+.1)/.5))));A.spec.push(Math.pow(Math.max(0,nx*Hh[0]+ny*Hh[1]+nv*Hh[2]),50));A.rim.push(Math.pow(1-nv,2.6));A.al.push(a*255)}
        const N=A.idx.length;
        function drawPlanet(rp){const cp=rp*1.35;for(let k=0;k<N;k++){const t=A.ty[k],tx=((A.lon[k]+rp)|0)&2047,row=t*TW,ti=row+tx,b=ti*4,d=A.day[k];let lit=.045+d*1.05;if(tex[b+3])lit*=1+(hgt[row+((tx-1)&2047)]-hgt[row+((tx+1)&2047)])*.09;let r=tex[b]*lit,gg=tex[b+1]*lit,bl=tex[b+2]*lit;
            if(!tex[b+3]){const s=A.spec[k]*d*150;r+=s;gg+=s;bl+=s}
            const cl=city[ti];if(cl&&d<.5){const n=(1-d*2)*cl/255;r+=255*n;gg+=190*n;bl+=90*n}
            const fx=A.lon[k]+cp,x0=Math.floor(fx),ax=fx-x0,y0=A.tf[k]|0,ay=A.tf[k]-y0,xa=x0&2047,xb=(x0+1)&2047,r0=y0*CW,r1=r0+CW,c0=((cloud[r0+xa]*(1-ax)+cloud[r0+xb]*ax)*(1-ay)+(cloud[r1+xa]*(1-ax)+cloud[r1+xb]*ax)*ay)/255,c=c0*c0*(3-2*c0)*.9*ca,w=255*(.05+d*.97),cs=0;r*=1-cs;gg*=1-cs;bl*=1-cs;r=r*(1-c)+w*c;gg=gg*(1-c)+w*c;bl=bl*(1-c)+(w+8)*c;
            const rm=A.rim[k]*(.15+d*1.1),wm=A.rim[k]*d*(1-d)*3.6,o=A.idx[k];dat[o]=r+50*rm+200*wm;dat[o+1]=gg+120*rm+90*wm;dat[o+2]=bl+255*rm+30*wm;dat[o+3]=A.al[k]}
            px.putImageData(img,0,0)}

        const O=[
            {id:'SHARPRENDER',kind:'ship',a:2.2,e:.1,i:.55,N:.6,w:.5,M0:0,pf:1.1,col:'#fbbf24'},
            {id:'AURORA-1',kind:'sat',a:1.5,e:.05,i:1.25,N:-.8,w:0,M0:1.2,retro:1,col:'#a78bfa'},
            {id:'HELIOS-7',kind:'sat',a:1.8,e:.22,i:.8,N:2.4,w:1,M0:3,col:'#34d399'},
            {id:'VEGA-RELAIS',kind:'sat',a:1.35,e:.02,i:1.45,N:.3,w:0,M0:4.5,col:'#f472b6'},
            {id:'LUNA-STATION',kind:'sat',a:2,e:.06,i:.3,N:-.5,w:0,M0:2,col:'#cbd5e1'},
            {id:'ORION-STATION',kind:'station',a:1.18,e:0,i:.9,N:1.8,w:0,M0:5.2,col:'#fb923c'}];
        const TERRA={id:'TERRA-KONTROLLE',col:'#5fd0ff'},byId={'TERRA-KONTROLLE':TERRA};O.forEach(o=>byId[o.id]=o);
        const PHI=.38;
        function kep(M,e){let E=M;for(let i=0;i<5;i++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E}
        function orb(o,nu,currentN){
            const r=o.a*(1-o.e*o.e)/(1+o.e*Math.cos(nu)),
                x=r*Math.cos(nu+o.w),
                y=r*Math.sin(nu+o.w),
                y1=y*Math.cos(o.i),
                z1=y*Math.sin(o.i),
                c=Math.cos(currentN),
                s=Math.sin(currentN);
            return [x*c - y1*s, x*s + y1*c, z1];
        }
        function proj(X,Y,Z){const cf=Math.cos(PHI),sf=Math.sin(PHI);return{x:cx+X*R,y:cy-(Z*cf+Y*sf)*R,d:Y*cf-Z*sf}}
        function pos(o,ot){
            const precession = (o.retro ? -0.015 : 0.01) * ot / (o.a * o.a * o.a);
            const currentN = o.N + precession;

            const M=(o.M0+T*ot/(22*Math.pow(o.a,1.5)*(o.pf||1)))%T,E=kep(M,o.e);
            let nu=2*Math.atan2(Math.sqrt(1+o.e)*Math.sin(E/2),Math.sqrt(1-o.e)*Math.cos(E/2));
            if(o.retro)nu=-nu;
            const p=proj(...orb(o,nu,currentN));
            return{x:p.x,y:p.y,z:Math.max(-1,Math.min(1,-p.d/2.5)), nu, currentN}}
        function ship(ot){
            let gr=g.createLinearGradient(-78,0,-200,0);gr.addColorStop(0,'rgba(120,190,255,.55)');gr.addColorStop(1,'rgba(120,190,255,0)');g.fillStyle=gr;g.fillRect(-200,-2,122,4);
            g.strokeStyle='#7d889e';g.lineWidth=2.2;g.beginPath();g.moveTo(-42,0);g.lineTo(-52,-16);g.moveTo(-42,0);g.lineTo(-52,16);g.stroke();
            for(const y of[-17,17]){const n=g.createLinearGradient(0,y-6,0,y+6);n.addColorStop(0,'#aab3c5');n.addColorStop(1,'#4b5568');g.fillStyle=n;g.beginPath();g.roundRect(-78,y-5,50,10,5);g.fill();
                g.fillStyle=`rgba(90,170,255,${.6+.4*Math.sin(ot*6+y)})`;g.fillRect(-72,y-2.5,34,5);g.fillStyle='#ff5a3c';g.beginPath();g.arc(-29,y,4.5,0,T);g.fill()}
            g.fillStyle='#8b95aa';g.beginPath();g.ellipse(-36,0,24,7.5,0,0,T);g.fill();
            g.fillStyle='#5ad0ff';g.beginPath();g.arc(-20,0,3.2,0,T);g.fill();
            g.fillStyle='#7a849a';g.fillRect(-18,-3,28,6);
            gr=g.createRadialGradient(26,-6,2,28,0,38);gr.addColorStop(0,'#f3f6fc');gr.addColorStop(1,'#7c879d');g.fillStyle=gr;g.beginPath();g.ellipse(28,0,30,21,0,0,T);g.fill();
            g.strokeStyle='rgba(30,40,60,.5)';g.lineWidth=.8;g.beginPath();g.ellipse(28,0,22,14,0,0,T);g.stroke();
            g.fillStyle='#cfd6e6';g.beginPath();g.arc(32,0,6,0,T);g.fill();g.fillStyle='rgba(80,90,110,.8)';g.beginPath();g.arc(32,0,2.2,0,T);g.fill();
            g.fillStyle='rgba(255,230,160,.85)';for(let i=0;i<9;i++){const a=i*.7;g.fillRect(28+Math.cos(a)*18-.6,Math.sin(a)*11-.6,1.2,1.2)}
            g.fillStyle=Math.sin(ot*5)>0?'#ff4d4d':'#5a1c1c';g.fillRect(55,-1,2,2)}
        function sat(ot,col){g.fillStyle='#d8b45a';g.fillRect(-4,-3,8,6);
            for(const s of[-1,1]){const x=s>0?5:-19;g.fillStyle='#244f9e';g.fillRect(x,-3.2,14,6.4);g.strokeStyle='rgba(160,200,255,.6)';g.lineWidth=.5;g.beginPath();for(let i=1;i<4;i++){g.moveTo(x+i*3.5,-3.2);g.lineTo(x+i*3.5,3.2)}g.moveTo(x,0);g.lineTo(x+14,0);g.stroke()}
            g.fillStyle='#e5e7eb';g.beginPath();g.arc(0,-5,2.2,Math.PI,0);g.fill();
            g.fillStyle=Math.sin(ot*4+col.length)>.3?col:'#222';g.fillRect(-1,-1,2,2)}
        function station(ot){
            g.fillStyle='#8a94a8';g.fillRect(-40,-1.6,80,3.2);
            for(const s of[-1,1]){const x=s*34;g.fillStyle='#244f9e';g.fillRect(x-5,-20,10,18);g.fillRect(x-5,2,10,18);g.strokeStyle='rgba(160,200,255,.55)';g.lineWidth=.5;g.beginPath();for(let i=1;i<5;i++){g.moveTo(x-5,-20+i*3.6);g.lineTo(x+5,-20+i*3.6);g.moveTo(x-5,2+i*3.6);g.lineTo(x+5,2+i*3.6)}g.stroke()}
            g.strokeStyle='#aab3c5';g.lineWidth=4;g.beginPath();g.ellipse(0,0,22,10,0,0,T);g.stroke();g.strokeStyle='#4b5568';g.lineWidth=1;g.beginPath();g.ellipse(0,0,22,10,0,0,T);g.stroke();
            for(let i=0;i<6;i++){const a=ot*.5+i*T/6,x=Math.cos(a)*22,y=Math.sin(a)*10;g.strokeStyle='#7d889e';g.lineWidth=1.2;g.beginPath();g.moveTo(0,0);g.lineTo(x,y);g.stroke();g.fillStyle='rgba(255,225,150,.9)';g.fillRect(x-1,y-1,2,2)}
            const h=g.createRadialGradient(-1.5,-1.5,1,0,0,7);h.addColorStop(0,'#f1f4fa');h.addColorStop(1,'#6b7589');g.fillStyle=h;g.beginPath();g.arc(0,0,7,0,T);g.fill();
            g.fillStyle='#cfd6e6';g.fillRect(-46,-2.4,6,4.8);g.fillRect(40,-2.4,6,4.8);g.fillStyle=Math.sin(ot*3)>0?'#fb923c':'#3a2410';g.fillRect(45,-1,2,2)}
        function gateway(ot){g.rotate(-.35);
            for(const s of[-1,1])for(const x of[-17,3]){const y=s>0?8:-30;g.fillStyle='#244f9e';g.fillRect(x,y,14,22);g.strokeStyle='rgba(160,200,255,.55)';g.lineWidth=.5;g.beginPath();for(let i=1;i<4;i++){g.moveTo(x+i*3.5,y);g.lineTo(x+i*3.5,y+22)}for(let j=1;j<5;j++){g.moveTo(x,y+j*4.4);g.lineTo(x+14,y+j*4.4)}g.stroke()}
            g.fillStyle='#8a94a8';g.fillRect(-1.5,-30,3,60);
