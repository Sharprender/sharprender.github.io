<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sharprender - Sternenflotte</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='d' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23060a18'/%3E%3Cstop offset='100%25' stop-color='%2301040a'/%3E%3C/linearGradient%3E%3Cfilter id='g' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeGaussianBlur stdDeviation='1' result='blur'/%3E%3CfeComposite in='SourceGraphic' in2='blur' operator='over'/%3E%3C/filter%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='url(%23b)' stroke='%2338bdf8' stroke-width='1.5' stroke-opacity='0.6'/%3E%3Cpath d='M32 11C38 27 48 41 53 52C55 56 51 60 46 57C40 53 36 50 32 48C28 50 24 53 18 57C13 60 9 56 11 52C16 41 26 27 32 11Z' fill='url(%23d)' filter='url(%23g)'/%3E%3C/svg%3E">
    <style>
        :root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#01040a;--fg:#d8e4fc;--mut:#6f82a8}
        html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        #c{position:fixed;inset:0;width:100%;height:100%;display:block}

        /* Start-Animation: Längere Standzeit (8s), kühles Enterprise-Blau, sanftes Ein- und langsames Ausblenden */
        #intro-greeting {
            position: fixed;
            top: 8vh;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 500;
            letter-spacing: 0.25em;
            color: #7aa2e3;
            text-shadow: 0 0 15px rgba(82, 131, 209, 0.4);
            animation: fadeInOut 8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                letter-spacing: 0.4em;
                filter: blur(4px);
            }
            15% {
                opacity: 1;
                letter-spacing: 0.25em;
                filter: blur(0px);
            }
            75% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                filter: blur(2px);
            }
        }

        /* Funk-Panel (Standard Desktop: Unten rechts verankert) */
        #comm{
            position:fixed;
            right:20px;
            bottom:20px;
            width:340px;
            display:flex;
            flex-direction:column;
            border-radius:18px;
            background:rgba(6,10,24,.8);
            -webkit-backdrop-filter:blur(14px);
            backdrop-filter:blur(14px);
            border:1px solid rgba(120,160,255,.16);
            box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 40px rgba(60,100,200,.04);
            z-index:10;
            transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #comm header{
            display:flex;
            align-items:center;
            gap:10px;
            padding:12px 16px;
            border-bottom:1px solid rgba(120,160,255,.1);
            font-size:.75rem;
            letter-spacing:.12em;
            cursor:pointer;
            user-select:none;
        }
        #comm header:hover{background:rgba(120,160,255,.05)}
        #comm header small{margin-left:auto;color:var(--mut);font-size:.62rem;letter-spacing:.04em}

        #toggle-btn{
            background:rgba(56,189,248,.15);
            border:1px solid rgba(56,189,248,.3);
            color:#38bdf8;
            padding:2px 6px;
            border-radius:4px;
            font-size:.65rem;
            cursor:pointer;
            font-family:ui-monospace,Menlo,monospace;
        }
        #toggle-btn:hover{background:rgba(56,189,248,.3)}

        .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:p 1.6s infinite}
        @keyframes p{50%{opacity:.25}}

        #feed-container{
            min-height: 200px;
            max-height: min(320px, 40vh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, min-height 0.3s ease;
        }
        #comm.collapsed #feed-container{
            min-height: 0;
            max-height: 0;
            opacity: 0;
        }

        #feed{
            flex:1;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            justify-content:flex-end;
            gap:10px;
            padding:14px 16px;
            -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16%);
            mask-image:linear-gradient(to bottom,transparent,#000 16%);
        }
        .msg{font-size:.75rem;line-height:1.4;animation:m .5s ease both}
        @keyframes m{from{opacity:0;transform:translateY(8px)}}
        .meta{display:flex;gap:5px;flex-wrap:wrap;font-size:.62rem;color:var(--mut);margin-bottom:2px}
        .meta b{font-weight:600}
        .txt{color:#c8d4ef}

        /* Mobile Optimierung */
        @media (max-width:820px){
            #comm{
                left:10px;
                right:10px;
                bottom:0;
                width:auto;
                border-radius:18px 18px 0 0;
                border-left:none;
                border-right:none;
                border-bottom:none;
                background:rgba(6,10,24,.92);
            }
            #comm header{padding:10px 14px;font-size:.7rem}
            #feed-container{
                min-height: 140px;
                max-height: 22vh;
            }
            #feed{padding:10px 14px;gap:8px}
            .msg{font-size:.7rem}
        }
    </style>
</head>
<body>
<div id="intro-greeting">Lebe lang und in Frieden 🖖</div>
<canvas id="c"></canvas>
<aside id="comm" aria-label="Funkverkehr">
    <header id="comm-header">
        <span class="dot"></span>
        <b>FUNKVERKEHR</b>
        <small>Subraum 47,3 MHz</small>
        <button id="toggle-btn" aria-label="Ein- und ausblenden">[ − ]</button>
    </header>
    <div id="feed-container">
        <div id="feed" aria-live="polite"></div>
    </div>
</aside>

<script>
    const commPanel = document.getElementById('comm');
    const toggleBtn = document.getElementById('toggle-btn');
    const commHeader = document.getElementById('comm-header');

    function toggleComm(e) {
        e.stopPropagation();
        commPanel.classList.toggle('collapsed');
        toggleBtn.textContent = commPanel.classList.contains('collapsed') ? '[ + ]' : '[ − ]';
    }

    toggleBtn.addEventListener('click', toggleComm);
    commHeader.addEventListener('click', toggleComm);

    (()=>{
        const cv=document.getElementById('c'),g0=cv.getContext('2d');let g=g0;
        const glc=document.createElement('canvas'),c2=document.createElement('canvas'),g2=c2.getContext('2d');
        glc.style.cssText=c2.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none';
        cv.after(glc);glc.after(c2);
        for(const [bg,bm] of [['rgba(10,40,85,.14)','multiply'],['rgba(20,50,100,.07)','overlay']]){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:5;background:'+bg+';mix-blend-mode:'+bm;document.body.append(d)}
        function glResize(){c2.width=glc.width=cv.width;c2.height=glc.height=cv.height}
        const glVS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
        const glFS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D T0,T1,T2;
uniform vec2 C;uniform float Rp,rot,ca,fade;
void main(){
 vec2 q=(gl_FragCoord.xy-C)/Rp;float nx=q.x,ny=-q.y;
 float d2=nx*nx+ny*ny;
 float a=clamp((1.-sqrt(d2))*Rp+.5,0.,1.);
 if(a<=0.){gl_FragColor=vec4(0.);return;}
 float nv=sqrt(max(0.,1.-d2));
 float yy=ny*.91712+nv*.39861,zz=-ny*.39861+nv*.91712;
 float u=atan(nx,zz)/6.2831853+.5+rot/2048.;
 float v=.5+asin(clamp(yy,-1.,1.))/3.14159265;
 vec3 n3=vec3(nx,ny,nv),L=vec3(-.62,-.28,.73);
 float day=smoothstep(0.,1.,clamp((dot(n3,L)+.1)/.5,0.,1.));
 vec4 c=texture2D(T0,vec2(u,v)),m=texture2D(T1,vec2(u,v));
 float land=step(.5,c.a);
 float hx=texture2D(T1,vec2(u-1./2048.,v)).r-texture2D(T1,vec2(u+1./2048.,v)).r;
 float lit=(.045+day*1.05)*(1.+land*hx*255.*.09);
 vec3 col=c.rgb*lit;
 float spec=pow(max(0.,dot(n3,normalize(L+vec3(0.,0.,1.)))),50.);
 col+=(1.-land)*spec*day*150./255.;
 col+=vec3(200.,220.,255.)/255.*clamp(1.-day*2.,0.,1.)*m.g;
 float c0=texture2D(T2,vec2(u+rot*.35/2048.,v)).r;
 float cl=c0*c0*(3.-2.*c0)*.9*ca;
 float w=.05+day*.97;
 col=mix(col,vec3(w,w,w+12./255.),cl);
 float rim=pow(1.-nv,2.6),rm=rim*(.15+day*1.1),wm=rim*day*(1.-day)*3.6;
 col+=vec3(40.*rm+180.*wm,100.*rm+120.*wm,240.*rm+70.*wm)/255.;
 gl_FragColor=vec4(clamp(col,0.,1.),1.)*a*fade;
}`;
        let glOK=false,gl=null,glU={},glT=[],glUp=[0,0,0];
        try{
            gl=glc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false});
            if(gl){
                const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o};
                const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,glVS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,glFS));gl.linkProgram(p);
                if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error('Shader-Link fehlgeschlagen');
                gl.useProgram(p);
                gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
                const loc=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
                for(const n of['C','Rp','rot','ca','fade'])glU[n]=gl.getUniformLocation(p,n);
                for(let i=0;i<3;i++){
                    const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);
                    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
                    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
                    glT.push(t);gl.uniform1i(gl.getUniformLocation(p,'T'+i),i)}
                gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
                glOK=true}
        }catch(e){glOK=false;console.warn('WebGL nicht verfügbar, Software-Planet aktiv:',e)}
        if(!glOK)glc.style.display='none';
        function glPlanet(sx,sy){
            const up=(i,d,w,h,f)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,glT[i]);gl.texImage2D(gl.TEXTURE_2D,0,f,w,h,0,f,gl.UNSIGNED_BYTE,d)};
            if(!glUp[0]||(stage===3&&!glUp[2])){
                const m=new Uint8Array(TW*TH*4);for(let i=0,n=TW*TH;i<n;i++){m[i*4]=hgt[i];m[i*4+1]=city[i];m[i*4+3]=255}
                up(0,tex,TW,TH,gl.RGBA);up(1,m,TW,TH,gl.RGBA);glUp[0]=1;if(stage===3)glUp[2]=1}
            if(cloudsReady&&!glUp[1]){up(2,cloud,CW,CH,gl.LUMINANCE);glUp[1]=1}
            const w2=glc.width,h2=glc.height,rr=R*D*1.1,x0=cx*D+sx,y0=h2-(cy*D+sy);
            gl.viewport(0,0,w2,h2);gl.enable(gl.SCISSOR_TEST);
            gl.scissor(Math.max(0,x0-rr|0),Math.max(0,y0-rr|0),rr*2+2|0,rr*2+2|0);
            gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
            for(let i=0;i<3;i++){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,glT[i])}
            gl.uniform2f(glU.C,x0,y0);gl.uniform1f(glU.Rp,R*D);gl.uniform1f(glU.rot,rot);gl.uniform1f(glU.ca,ca);gl.uniform1f(glU.fade,fade);
            gl.drawArrays(gl.TRIANGLES,0,3)}

        let W,H,D,R,cx,cy,nebula,mx=0,tmx=0, scaleFactor=1;
        const rnd=(a,b)=>a+Math.random()*(b-a),T=6.2832;

        const STAR_COLORS = ['#8cb0ff', '#a5c2ff', '#c5d8ff', '#f0f4ff', '#e6f0ff', '#ffcc99', '#ffb366'];
        const stars=Array.from({length:850},()=>({
            x:Math.random(),
            y:Math.random(),
            r:Math.pow(Math.random(), 3) * 1.8 + 0.4,
            p:Math.random()*T,
            s:rnd(.2,1.8),
            l:Math.random()*3|0,
            c:STAR_COLORS[Math.floor(Math.random()*STAR_COLORS.length)]
        }));

        function resize(){
            D=Math.min(devicePixelRatio||1,innerWidth<=820?1.5:2);
            W=innerWidth;
            H=innerHeight;
            cv.width=W*D;
            cv.height=H*D;glResize();
            cx=W/2;

            if(W <= 820) {
                cy = H * 0.35;
                R = Math.min(W, H) * 0.24; // Deutlich vergrößerter Radius für Mobilgeräte
                scaleFactor = 1.35; // Zusätzlicher Skalierungsfaktor für Schiffe auf Handys
            } else {
                cy = H / 2;
                R = Math.min(W, H) * 0.20; // Vergrößerter Radius für Desktop (vorher 0.16)
                scaleFactor = 1.15;
            }

            buildNebula();
        }

        function buildNebula(){
            nebula=document.createElement('canvas');
            const w=nebula.width=W>>1,h=nebula.height=H>>1,n=nebula.getContext('2d');
            n.globalCompositeOperation='lighter';
            const cols=[[30,40,90],[20,60,110],[60,40,90],[10,50,80]];
            for(const c of cols){
                const bx=rnd(.1,.9)*w,by=rnd(.1,.9)*h;
                for(let i=0;i<18;i++){
                    const x=bx+rnd(-1,1)*w*.28,y=by+rnd(-1,1)*h*.28,r=rnd(.15,.38)*w,gr=n.createRadialGradient(x,y,0,x,y,r);
                    gr.addColorStop(0,`rgba(${c},.045)`);
                    gr.addColorStop(1,'rgba(0,0,0,0)');
                    n.fillStyle=gr;n.fillRect(x-r,y-r,2*r,2*r);
                }
            }
            buildDeep();
        }

        let deep;
        function buildDeep(){
            deep=document.createElement('canvas');deep.width=W;deep.height=H;
            const d=deep.getContext('2d');
            d.save();d.translate(W/2,H/2);d.rotate(-.45);
            const bh=H*.35,gr=d.createLinearGradient(0,-bh,0,bh);
            gr.addColorStop(0,'rgba(100,130,210,0)');
            gr.addColorStop(.3,'rgba(110,140,220,.04)');
            gr.addColorStop(.5,'rgba(140,170,245,.09)');
            gr.addColorStop(.7,'rgba(110,140,220,.04)');
            gr.addColorStop(1,'rgba(100,130,210,0)');
            d.fillStyle=gr;d.fillRect(-W*1.5,-bh,3*W,2*bh);

            for(let i=0;i<3500;i++){
                const band=i%4>0,x=rnd(-W*1.2,W*1.2),y=band?(Math.random()+Math.random()+Math.random()-1.5)*bh*.8:rnd(-H,H);
                d.fillStyle=`rgba(${160+Math.random()*50|0},${190+Math.random()*50|0},255,${rnd(.04,.4)})`;
                d.fillRect(x,y,rnd(.5,1.2),rnd(.5,1.2));
            }
            d.globalCompositeOperation='destination-out';
            for(let i=0;i<12;i++){
                const x=rnd(-W*.8,W*.8),y=rnd(-bh*.6,bh*.6),r=rnd(30,110);
                const dg=d.createRadialGradient(x,y,0,x,y,r);
                dg.addColorStop(0,'rgba(0,0,0,0.6)');
                dg.addColorStop(1,'rgba(0,0,0,0)');
                d.fillStyle=dg;d.beginPath();d.arc(x,y,r,0,T);d.fill();
            }
            d.restore();
        }

        const TW=2048,TH=1024,CW=2048,CH=1024;
        const hs=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
        const sm=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
        function nz(x,y,p){const x0=Math.floor(x),y0=Math.floor(y),fx=sm(x-x0),fy=sm(y-y0),a=((x0%p)+p)%p,b=(a+1)%p;return(hs(a,y0)*(1-fx)+hs(b,y0)*fx)*(1-fy)+(hs(a,y0+1)*(1-fx)+hs(b,y0+1)*fx)*fy}
        function fbm(u,v,base,o){let s=0,a=.5,t=0;for(let i=0;i<o;i++){const p=base<<i;s+=a*nz(u*p,v*p*.5+i*7.3,p);t+=a;a*=.5}return s/t}
        const tex=new Uint8ClampedArray(TW*TH*4),city=new Uint8Array(TW*TH),hgt=new Uint8Array(TW*TH),cloud=new Uint8Array(CW*CH);
        function texel(x,y){const v=y/TH,u=x/TW,e=fbm(u,v,4,8),m=fbm(u+.31,v+.17,3,4),i=y*TW+x,k=i*4,pol=Math.abs(v-.5)*2+(m-.5)*.18;let r,gg,b,land=0,dt=.5;city[i]=0;
            if(e<.5){const t=Math.max(0,(e-.3)/.2);r=mix(4,25,t*t);gg=mix(20,110,t*t);b=mix(60,150,t*t);if(e>.486){const f=(e-.486)/.014*.6;r=mix(r,180,f);gg=mix(gg,210,f);b=mix(b,230,f)}}
            else{land=255;const t=Math.min(1,(e-.5)/.2);
                const lat=Math.abs(v-.5)*2;if(e<.525){r=180;gg=170;b=130}else{const sc=x=>x<0?0:x>1?1:x,dr=1-sm(sc((m-.43)/.06)),wr=sm(sc((m-.55)/.08))*(1-sm(sc((lat-.25)/.12))),wt=sm(sc((lat-.5)/.18)),wd=dr*(1-wt);
                    let R1=mix(50,22,t),G1=mix(110,75,t),B1=mix(60,45,t);
                    R1=mix(R1,mix(15,12,t),wr);G1=mix(G1,mix(75,55,t),wr);B1=mix(B1,mix(40,32,t),wr);
                    R1=mix(R1,mix(80,60,t),wt);G1=mix(G1,mix(90,70,t),wt);B1=mix(B1,mix(85,75,t),wt);
                    R1=mix(R1,mix(180,130,t),wd);G1=mix(G1,mix(145,100,t),wd);B1=mix(B1,mix(110,85,t),wd);r=R1;gg=G1;b=B1}
                if(e>.64){const q=sm(Math.min(1,(e-.64)/.12));r=mix(r,110,q);gg=mix(gg,105,q);b=mix(b,115,q)}
                if(e>.72){const q=sm(Math.min(1,(e-.72)/.1));r=mix(r,230,q);gg=mix(gg,235,q);b=mix(b,250,q)}
                if(e>.525&&e<.64&&nz(u*160,v*80,160)>.62&&hs(x>>2,y>>2)>.72)city[i]=100+120*hs(x,y)}
            if(pol>.86){const t=Math.min(1,(pol-.86)/.06);r=mix(r,220,t);gg=mix(gg,230,t);b=mix(b,250,t)}
            if(land){dt=fbm(u,v,48,4);const q=.78+.44*dt;r*=q;gg*=q;b*=q}const gn=.9+.2*nz(u*512,v*256,512);tex[k]=r*gn;tex[k+1]=gg*gn;tex[k+2]=b*gn;tex[k+3]=land;hgt[i]=Math.max(0,Math.min(255,e*255+(dt-.5)*70))}
        function cloudTexel(x,y){const c=fbm(x/CW,y/CH,6,7);cloud[y*CW+x]=255*Math.pow(sm(Math.min(1,Math.max(0,(c-.44)/.36))),1.15)}
        let ready=false,cloudsReady=false,ca=0,stage=0,gy=0,fade=0;
        function cp(i,j){for(let q=0;q<4;q++)tex[j*4+q]=tex[i*4+q];city[j]=city[i];hgt[j]=hgt[i]}
        function gen(ms){const t0=performance.now();while(stage<3&&performance.now()-t0<ms){
            if(stage===0){for(let x=0;x<TW;x+=2){texel(x,gy);const i=gy*TW+x;cp(i,i+1);cp(i,i+TW);cp(i,i+TW+1)}gy+=2;if(gy>=TH){stage=1;gy=0;ready=true}}
            else if(stage===1){for(let x=0;x<CW;x++)cloudTexel(x,gy);if(++gy>=CH){stage=2;gy=0;cloudsReady=true}}
            else{for(let x=0;x<TW;x++)if((x|gy)&1)texel(x,gy);if(++gy>=TH)stage=3}}}

        function generateMoonTexture() {

            mCtx.fillRect(0, 0, MOON_PS, MOON_PS);

            const imgData = mCtx.getImageData(0, 0, MOON_PS, MOON_PS);
            const data = imgData.data;
            for(let y=0; y<MOON_PS; y++) {
                for(let x=0; x<MOON_PS; x++) {
                    let idx = (y * MOON_PS + x) * 4;
                    let nx = x / MOON_PS, ny = y / MOON_PS;
                    let n = Math.sin(nx * 30) * Math.cos(ny * 30) * 8 + Math.sin(nx * 80) * Math.cos(ny * 80) * 4;
                    let baseVal = 72 + n + (Math.random() - 0.5) * 12;
                    data[idx] = baseVal;
                    data[idx+1] = baseVal + 2;
                    data[idx+2] = baseVal + 4;
                }
            }
            mCtx.putImageData(imgData, 0, 0);

            const maria = [
                {x: 160, y: 180, rx: 110, ry: 90},
                {x: 340, y: 200, rx: 90, ry: 80},
                {x: 240, y: 320, rx: 100, ry: 70},
                {x: 400, y: 380, rx: 70, ry: 60},
                {x: 120, y: 360, rx: 60, ry: 50}
            ];

            for(let m of maria) {
                let grad = mCtx.createRadialGradient(m.x, m.y, 10, m.x, m.y, m.rx);
                grad.addColorStop(0, 'rgba(25, 27, 32, 0.85)');
                grad.addColorStop(0.6, 'rgba(35, 38, 44, 0.5)');
                grad.addColorStop(1, 'rgba(50, 53, 58, 0)');
                mCtx.fillStyle = grad;
                mCtx.beginPath();
                mCtx.ellipse(m.x, m.y, m.rx, m.ry, Math.random(), 0, T);
                mCtx.fill();
            }

            for(let i=0; i<300; i++) {
                let cx = Math.random() * MOON_PS;
                let cy = Math.random() * MOON_PS;
                let r = Math.pow(Math.random(), 2) * 20 + 1.5;

                mCtx.strokeStyle = 'rgba(200, 208, 220, 0.22)';
                mCtx.lineWidth = Math.max(0.8, r * 0.18);
                mCtx.beginPath();

            [TK,'Warbird Valdore','Valdore, scannen Sie den Landekorridor. Freigabe erteilt.'],
            ['AURORA-1',TK,'Telemetrie stabil. Solarpaneele zu 98 % ausgerichtet.'],
            [TK,'AURORA-1','Verstanden, Aurora. Datenübertragung läuft.']];

        const INCIDENT_TEMPLATES = [
            () => {
                const shipA = generateRandomName('fed');
                const shipB = generateRandomName('fed');
                const sec = 1 + Math.random() * 35 | 0;
                return [
                    [HQ, 'ALLE', `⚠️ PRIORITÄT ALPHA: Borg-Kubus in Sektor ${sec} gesichtet! ${shipA} und ${shipB} auf Abfangkurs gehen.`],
                    [shipA, HQ, `${shipA} meldet: Schilde brechen ein! Wir erwidern das Feuer.`]
                ];
            },
            () => {
                const ship = generateRandomName(FACTION_TYPES[Math.random() * FACTION_TYPES.length | 0]);
                const sec = 1 + Math.random() * 40 | 0;
                return [
                    [HQ, 'ALLE', `🚨 WARNUNG: Transwarp-Anomalie nahe Sektor ${sec} detektiert. Borg-Sphäre bricht durch!`],
                    [TK, 'ALLE', `Terra-Kontrolle alarmiert: Alle Stationen Bereitschaftsstufe 2. ${ship} sichert den äußeren Perimeter.`]
                ];
            },
            () => {
                const system = ['Betrezed', 'Wolf-359', 'Risa', 'Denobula', 'Andor', 'Bajor', 'Cardassia Prime', 'Qo\'noS'][Math.random() * 8 | 0];
                return [
                    [HQ, 'ALLE', `🔥 NOTRUF aus dem ${system}-System: Instabile Supernova-Aktivität bedroht zivile Kolonien. Flotte mobilisiert Frachter zur Evakuierung.`],
                    [TK, HQ, `Terra-Landebuchten für Flüchtlingskonvois aus ${system} vorbereitet.`]
                ];
            },
            () => {
                const ship = generateRandomName('klingon');
                return [
                    [ship, TK, `Empire-Meldung: ${ship} hat Orion-Piraten im neutralen Grenzgebiet erfolgreich neutralisiert. Ehre dem Hohen Rat!`],
                    [TK, ship, `Verstanden, ${ship}. Kursabweichungen innerhalb der Handelszone wurden registriert.`]
                ];
            },
            () => {
                const ship = generateRandomName('romulan');
                return [
                    [ship, HQ, `Romulanischer Außenposten meldet: Unerlaubte Tachyon-Scans an der Neutralen Zone durch unbekanntes Schiff.`],
                    [HQ, ship, `Untersuchung eingeleitet. Halten Sie Ihre Schiffsformation innerhalb der vertraglichen Grenzen.`]
                ];
            },
            () => {
                const ship = generateRandomName('fed');
                return [
                    [HQ, 'ALLE', `📡 SUBRAUM-NOTRUF: ${ship} meldet schwere Quantenphasen-Verzerrung im Plasmastrom. Hilfe angefordert!`],
                    [SH, HQ, `Sharprender empfängt Notruf von ${ship}. Traktorstrahl und Reparatur-Teams aktiviert.`]
                ];
            },
            () => {
                const ship = generateRandomName('fed');
                const planetName = ['Vulcan', 'Andoria', 'Tellar', 'Risa', 'Babel'][Math.random() * 5 | 0];
                return [
                    [ship, TK, `${ship} erbittet Erlaubnis zur Durchführung atmosphärischer Sensortests über ${planetName}.`],
                    [TK, ship, `Erlaubnis erteilt, ${ship}. Meiden Sie den zivilen Luftkorridor Delta.`]
                ];
            },
            () => {
                const freighter = generateRandomName('fed');
                return [
                    [freighter, TK, `${freighter} meldet Laderaum-Integrität bei 100%. Transport von medizinischen Synthetika für Aussenposten gesichert.`],
                    [TK, freighter, `Bestätigt. Kurskorrektur um 0,5 Grad zur Vermeidung von Weltraumschrott empfohlen.`]
                ];
            },
            () => {
                const ship = generateRandomName('klingon');
                return [
                    [ship, HQ, `${ship} fordert offizielle Handelsserie bezüglich dilithiumhaltiger Asteroiden im neutralen Sektor an.`],
                    [HQ, ship, `Anfrage an das Ministerium für interstellaren Handel weitergeleitet.`]
                ];
            },
            () => {
                const scienceShip = generateRandomName('fed');
                return [
                    [scienceShip, TK, `${scienceShip} registriert ungewöhnliche Chroniton-Partikel-Spuren im Orbit.`],
                    [TK, scienceShip, `Vorsicht geboten. Aktivieren Sie die temporalen Abschirmungen.`]
                ];
            }
        ];

        /*EVENTS_PATCH*/
        const PL=`Vulcan,Andoria,Tellar Prime,Risa,Betazed,Bajor,Cardassia Prime,Qo'noS,Romulus,Remus,Ferenginar,Trill,Denobula,Xindus,Talax,Rigel VII,Altair VI,Delta Vega,Ceti Alpha V,Organia,Rura Penthe,Khitomer,Praxis,Archanis IV,Berengaria VII,Beta Hydri II,Hanolin,Janus VI,Omicron Ceti III,Pollux IV,Regulus V,Talos IV,Tycho IV,Wolf 359,Zeta Gelis,Argelius II,Cait,Camus II,Capella IV,Cygnet XIV,Gamma Hydra,Gideon,Halcyon,Iotia,Kelva,Marcos XII,Nimbus III,Pyris VII,Rojan,Sarpeidon,Aldea,Ardana,Benzar,Bre'el IV,Chal,Deneva,Eminiar VII,Exo III,Galen IV,Ligon II,Mantiles,Mudd,Neural,Platonius,Psi 2000,Sigma Draconis VI,Taurus II,Vendikar,Zalkon,Ariannus,Bolarus IX,Cestus III,Tarsus IV,Epsilon Eridani,Procyon V,Tau Ceti IV,Alpha Centauri,Lyra Minor,Kestrel Reach,Aurelia,Brevik,Corvane,Dravos,Elysar,Fenwick,Galatea,Haven's Rest,Isodar,Jovian Ring,Kaltara,Lumeria,Meridian IX,Nyxar,Orpheus,Pelagos,Quillon,Ravenna,Solace,Thessaly,Umbriel,Valkyr,Westmark,Xenara,Ysolde,Zephyria,Ashgrove,Borealis,Cinder,Dunmere,Eventide`.split(','),
            RC=`Menschen|||#38bdf8|fed;Vulkanier|||#fbbf24|vulcan;Klingonen|||#f87171|klingon;Romulaner|||#34d399|romulan;Cardassianer|Cardassianischer Kreuzer|Hideki,Keldon,Galor,Prakesh,Torr|#fb923c;Ferengi|Ferengi-Marauder|Goldpreis,Latinum-Traum,Kassenschlager,Profit,Dividende|#facc15;Andorianer|Andorianischer Kreuzer|Kumari,Thalaron,Shran,Weißeis,Ch'Thane|#7dd3fc;Bajoraner|Bajoranisches Schiff|Prophet,Kendra,Ashalla,Solbor,Lunar|#f0abfc;Tellariten|Tellaritischer Frachter|Grunz,Dickschädel,Hartkopf,Gegenrede,Disput|#a3e635;Breen|Breen-Dreadnought|Chot,Thot,Frost,Gletscher,Eisenfaust|#94a3b8;Gorn|Gorn-Kreuzer|Schuppenwacht,Echse,Kazar,Steinkralle,Sonnenhort|#4ade80;Orioner|Orion-Schmuggler|Schattenhandel,Smaragdkuss,Nachtmarkt,Seidenfaden,Jadeblüte|#2dd4bf;Trill|Trill-Forschungsschiff|Dax,Symbiose,Leben,Gefährte,Zhian'tara|#c4b5fd;Betazoiden|Betazoiden-Gesandtschaft|Empathie,Troi,Lwaxana,Gedankenfluss,Seelenklang|#f9a8d4;Denobulaner|Denobulaner-Transporter|Phlox,Heiterkeit,Zwillingsmond,Flora,Heilkunde|#fde68a;Xindi|Xindi-Aviar|Flügelschlag,Himmelsjäger,Aquatik,Insektoid,Arboreal|#86efac;Talaxianer|Talaxianischer Händler|Neelix,Rinax,Leolakon,Fußwärmer,Kochtopf|#fdba74;Kazon|Kazon-Raider|Ogla,Nistrim,Relora,Halik,Mostral|#ef4444;Hirogen|Hirogen-Jäger|Trophäe,Fährte,Beutegreifer,Ahnenjagd,Mondjäger|#d97706;Suliban|Suliban-Zellenschiff|Cabal,Gestaltwandler,Schleicher,Tarn,Zeitgänger|#a78bfa;Tholianer|Tholianisches Netzschiff|Kristallnetz,Spinne,Hitzewebe,Prisma,Gitter|#fca5a5;Jem'Hadar|Jem'Hadar-Kampfschiff|Kampfgeboren,Ketracel,Vorta-Wille,Dominion,Gründer-Tross|#a855f7`.split(';').map(s=>s.split('|')),
            EV=[
                // Kataklysmen
                `H>A|🔥 KATAKLYSMUS: Instabiler Stern im {c}-System – Supernova in {n} Stunden erwartet. Evakuierung läuft!¦a>H|{a} übernimmt die Evakuierung von {k} Zivilisten.`,
                `c>A|🚨 {c}: Asteroidenschwarm im Anflug, Einschlag in {n} Minuten. Planetare Schilde bei {x} %.¦b>c|{b} bildet einen Abfangkordon, Phaser auf Zerstörung der Brocken.`,
                `H>A|🌀 WARNUNG: Gravitationswelle eines kollabierenden Schwarzen Lochs trifft Sektor {sec}. Kurs ändern!¦a>H|{a}: Trägheitsdämpfer am Limit, weichen aus.`,
                `T>A|⚡ Plasmastürme über {c}. Warpverkehr im Sektor {sec} eingestellt.¦b>T|{b} wartet im Orbit von {c} auf Freigabe.`,
                `c>H|☣️ SEUCHENALARM auf {c}: Unbekanntes Virus, {k} Infizierte. Bitte um medizinische Hilfe.¦a>c|{a}: Medizinschiff unterwegs, Impfstoff-Synthese beginnt in {n} Stunden.¦H>A|Quarantäne über {c} verhängt.`,
                `H>A|⏳ ZEITANOMALIE nahe {c}: Chroniton-Pegel steigt, temporale Schilde aktivieren!¦b>T|{b} meldet Chronometer-Abweichung von {n} Sekunden.`,
                `c>A|☀️ Sonneneruption der Klasse X bei {c}: Kommunikation gestört, Solarkollektoren abgeschaltet.¦T>c|Terra-Kontrolle leitet Notstrom über Relais um.`,
                // Attacken
                `c>H|🚨 ÜBERFALL auf {c}: Piratenflotte im Orbit, Schilde fallen!¦b>H|{b} eilt zur Verteidigung von {c}, Ankunft in {n} Minuten.`,
                `H>A|🟩 BORG-ALARM: Kubus bei {c} gesichtet. Alle Schiffe Abfangformation!¦a>H|{a} bestätigt, Schilde auf Maximum.`,
                `H>A|⚔️ Jem'Hadar-Kampfverband greift {c} an. Zivile Verluste: {n}.¦b>H|{b} hält die Linie, bitte um Verstärkung.`,
                `c>A|🔴 Hirogen-Jäger kreisen über {c}. Kolonisten verschanzen sich.¦a>c|{a} schickt Sicherheitsteams, Trophäen werden beschlagnahmt.`,
                `H>A|🚫 {b} blockiert den Orbit von {c} und fordert Zollgebühren.¦T>b|{b}, Blockade sofort beenden, sonst Warnschuss!`,
                `c>H|💥 SABOTAGE auf {c}: Reaktor der Minenanlage manipuliert, {n} Vermisste.¦a>c|{a} sucht nach Überlebenden.`,
                `b>H|Konvoi bei {c}: {b} meldet Überfall, {x} % der Ladung geraubt.¦H>A|Handelsrouten durch Sektor {sec} nur noch mit Geleit.`,
                `H>A|🧬 BIOSCHIFF-ALARM: Spezies 8472 bricht in Sektor {sec} aus dem Fluidraum. Alle Schiffe meiden!¦a>H|{a} meldet organische Hülle, Phaser wirkungslos.`,
                // Ankündigungen
                `H>A|📣 Friedensvertrag zwischen Föderation und {rb} unterzeichnet.¦b>H|{b}: Die {rb} danken. Frieden für {n} Jahre vereinbart.`,
                `H>A|📣 Handelsabkommen: Die {rb} erhalten Dilithium-Schürfrechte bei {c}.¦T>b|{b}, Frachtfreigabe für Sektor {sec} erteilt.`,
                `H>A|📣 Sperrzone: Sektor {sec} ab sofort wegen Anomalie gesperrt.¦a>H|{a} bestätigt und ändert Kurs auf {c}.`,
                `H>A|📣 Erstkontakt! Unbekannte Spezies bei {d} entdeckt. Diplomatenteam entsandt.¦a>H|{a} nähert sich vorsichtig, Universalübersetzer läuft.`,
                `H>A|📣 Thronwechsel bei den {rb}: neuer Anführer vereidigt. Glückwünsche der Föderation.¦b>H|{b} dankt, Feierlichkeiten auf {c}.`,
                `H>A|📣 Flottenmanöver in Sektor {sec}, {n} Schiffe beteiligt. Zivile Routen meiden.¦a>T|{a} meldet Übungsstart, Feuerfreigabe nur auf Zielsonden.`,
                // Treffen
                `^T>a|{a}, willkommen im Orbit. Die Delegation der {ra} wird erwartet.¦a>T|Danke, Terra-Kontrolle. Gipfeltreffen beginnt in {n} Minuten.`,
                `a>b|{a} an {b}: Rendezvous bei {c} bestätigt. Fracht wird übergeben.¦b>a|{b} empfängt Datenpakete, danke für die Eskorte.`,
                `H>A|🎭 Kulturfestival auf {c}: Musik und Küche der {rb} und {ra}. Alle Besatzungen eingeladen!¦c>A|Kolonisten von {c} begrüßen die Gäste mit {n} Banketten.`,
                `H>b|Gefangenenaustausch bei {c}: {n} Personen kehren heim.¦b>H|{b} bestätigt die Übergabe, alle wohlauf.`,
                `H>A|🪙 Handelsmesse auf {c}: Händler der {rb} bieten Waren aus {n} Systemen.¦b>T|{b} bittet um Landeerlaubnis für den Messestand.`,
                // Berichte aus den Kolonien
                `c>H|📋 Bericht {c}: Ernte {x} % des Solls, Wasserversorgung stabil, Bevölkerung {k}.¦H>c|Danke, {c}. Saatgutlieferung ist unterwegs.`,
                `c>H|📋 {c}: Terraforming bei {x} %, Atmosphäre atembar ab Zyklus {n}.¦H>c|Forschungsteam wird verstärkt.`,
                `d>H|⛏️ Bergbau auf {d}: neue Dilithiumader entdeckt, geschätzte Ausbeute {k} Tonnen.¦H>d|Förderlizenz genehmigt, {a} sichert den Abbau.`,
                `c>T|📡 {c} empfängt rätselhaftes Signal auf Subraumkanal {n}, Ursprung unbekannt.¦T>c|Daten bitte an {a} weiterleiten, Analyse läuft.`
            ],
            pick=a=>a[Math.random()*a.length|0],F3=['vulcan','klingon','romulan'],
            shipOf=r=>{if(r[4])return generateRandomName(r[4]);const id=r[1]+' '+pick(r[2].split(','));byId[id]=byId[id]||{id,col:r[3]};return id},
            mkEv=s=>()=>{
                const arr=s[0]==='^',txt=arr?s.slice(1):s,
                    ra=arr?pick(RC.filter(r=>F3.includes(r[4]))):pick(RC),rb=pick(RC.slice(1).filter(r=>r!==ra)),
                    V={ra:ra[0],rb:rb[0],a:shipOf(ra),b:shipOf(rb),c:pick(PL),n:2+Math.random()*45|0,sec:1+Math.random()*40|0,x:60+Math.random()*39|0,k:(2+Math.random()*90|0)*10};
                do V.d=pick(PL);while(V.d===V.c);
                if(arr)ARRIVALS.push({faction:ra[4],name:V.a,col:byId[V.a].col,angle:rnd(0,T),t0:performance.now()/1000});
                for(const t of['c','d'])byId['Kolonie '+V[t]]=byId['Kolonie '+V[t]]||{id:'Kolonie '+V[t],col:'#c4b5fd'};
                const id=t=>t==='H'?HQ:t==='T'?TK:t==='A'?'ALLE':(t==='c'||t==='d')?'Kolonie '+V[t]:V[t];
                return txt.split('¦').map(l=>{const[h,m]=l.split('|'),[f,to]=h.split('>');return[id(f),id(to),m.replace(/\{(\w+)\}/g,(_,k)=>V[k])]})};
        INCIDENT_TEMPLATES.push(...EV.map(mkEv));

        const TYPES=[{k:'shuttle',col:'#38bdf8',s:1.3,n:['Shuttle Galileo','Shuttle Curie','Shuttle Hopper']},{k:'freighter',col:'#f87171',s:1.1,n:['Frachter Meridian','Frachter Atlas','Frachter Nomad']},{k:'scout',col:'#2dd4bf',s:1.2,n:['Späher Kestrel','Späher Wisp','Späher Lynx']},{k:'cruiser',col:'#60a5fa',s:0.9,n:['USS Valiant','USS Kepler','USS Odyssey','USS Hypatia']}];

        function fill(s){return s.replace(/\{(\w+)\}/g,(_,k)=>({sec:1+Math.random()*12|0,sz:'2610.'+(100+Math.random()*265|0),p:90+Math.random()*9|0,ms:5+Math.random()*35|0,k:2+Math.random()*46|0,w:rnd(2,9).toFixed(1).replace('.',',')})[k])}

        function launchEx(){
            const ty=TYPES[Math.random()*4|0];
            const n=generateRandomName('fed');
            const L={ty,n,a:rnd(0,T),cv:Math.random()<.5?1:-1,ent:byId[n]=byId[n]||{id:n,col:ty.col}};
            return[[TK,n,n+', Startfreigabe erteilt. Triebwerke zünden.','launch',L],[n,TK,'Abgehoben. Steigflug nominal, Ziel Sektor {sec}.'],[TK,n,'Bahnfreigabe bestätigt. Verlassen Sie den Orbit auf Kurs {k}.'],[n,TK,'Warpfaktor {w} in drei, zwei, eins. Energie!','warp',L],[TK,n,'Gute Reise, '+n+'. Wir sehen uns bald wieder.']]
        }

        function triggerArrival(factionKey) {
            const fKey = factionKey || FACTION_TYPES[Math.random() * FACTION_TYPES.length | 0];
            const shipName = generateRandomName(fKey);
            const col = fKey === 'vulcan' ? '#fbbf24' : (fKey === 'klingon' ? '#f87171' : '#34d399');
            ARRIVALS.push({
                faction: fKey,
                name: shipName,
                col: col,
                angle: rnd(0, T),
                t0: performance.now() / 1000
            });
        }

        function edge(a){const dx=Math.cos(a),dy=Math.sin(a),rl=W>820?W-380:W,bl=W>820?H-20:H*.7,tx=dx>.001?(rl-cx)/dx:dx<-.001?(20-cx)/dx:1e9,ty=dy>.001?(bl-cy)/dy:dy<-.001?(70-cy)/dy:1e9;return Math.min(tx,ty)}
        function aim(L){for(let i=0;i<30;i++){L.a=rnd(0,T);L.cv=Math.random()<.5?1:-1;const e=Math.min(edge(L.a),edge(L.a+L.cv*.15),edge(L.a+L.cv*.3));if(e>R*2.3){L.rW=e*.88;L.rA=Math.max(R*1.4,e*.55);return}}L.a=0;L.cv=1;const e=Math.max(R*2,edge(0));L.rW=e*.88;L.rA=Math.max(R*1.4,e*.55)}

        function act(it){
            const L=it[4];
            if(it[3]==='launch'){
                aim(L);L.fl=Math.cos(L.a)<0;L.h=undefined;L.lt=0;L.t0=performance.now()/1000;L.w0=0;L.ent.live=null;LS.push(L);
            } else if(it[3]==='arrival') {
                triggerArrival(it[4]);
            } else if(L && L.t0) {
                L.w0=performance.now()/1000;
            }
        }

        let ex=script,ei=0,lastEx=-1,lastLaunch=-99,picks=0;
        function pickEx(){
            const now=performance.now()/1000,force=picks++===0;
            if(Math.random() < 0.28) {
                const f = FACTION_TYPES[Math.random() * FACTION_TYPES.length | 0];
                triggerArrival(f);
            }
            if(!LS.length&&now-lastLaunch>20&&(force||Math.random()<.5)){lastLaunch=now; return launchEx()}

            let i;do{i=Math.random()*INCIDENT_TEMPLATES.length|0}while(i===lastEx);lastEx=i;return INCIDENT_TEMPLATES[i]();
        }
        function next(){if(ei>=ex.length){ex=pickEx();ei=0}return ex[ei++]}
        function type(el,s){let i=0;(function n(){el.textContent=s.slice(0,++i);if(i<s.length)setTimeout(n,20)})()}
        function say(){const it=next(),f=it[0],to=it[1],txt=fill(it[2]),m=document.createElement('div');m.className='msg';
            const meta=document.createElement('div');meta.className='meta';
            const t=document.createElement('span');t.textContent=new Date().toLocaleTimeString('de-DE');
            const a=document.createElement('b');a.textContent=f;a.style.color=byId[f]?byId[f].col:'#38bdf8';
            const ar=document.createElement('span');ar.textContent='→';
            const b=document.createElement('b');b.textContent=to;b.style.color=byId[to]?byId[to].col:'#cbd5e1';
            meta.append(t,a,ar,b);const x=document.createElement('div');x.className='txt';m.append(meta,x);feed.append(m);
            while(feed.children.length>12)feed.firstChild.remove();
            type(x,txt);cur={f,to,t0:performance.now()/1000};act(it);
            setTimeout(say,txt.length*22+rnd(1400,2600))}
        setTimeout(say,1500);
    })();
</script>
